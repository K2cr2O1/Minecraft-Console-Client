name: Build Cross-Platform Binaries

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run tests
        run: dotnet test MinecraftClient.Tests/MinecraftClient.Tests.csproj -c Release --nologo

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-latest
            rid: win-arm64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish self-contained single-file binary (${{ matrix.rid }})
        shell: bash
        run: |
          dotnet publish MinecraftClient/MinecraftClient.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=Embedded \
            --nologo

      - name: List publish output
        shell: bash
        run: ls -lh "MinecraftClient/bin/Release/net10.0/${{ matrix.rid }}/publish/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftClient-${{ matrix.rid }}
          path: MinecraftClient/bin/Release/net10.0/${{ matrix.rid }}/publish/
          if-no-files-found: error
